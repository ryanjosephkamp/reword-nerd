name: Bug report
description: Report a reproducible problem with synthetic, non-confidential details.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are public. Do not attach or paste source documents, prompt packages, prompts, credentials, session content, or confidential material. Use a minimal synthetic example only.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing reports
      options:
        - label: I searched existing Issues and did not find this report.
          required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic-only evidence and included no source document, package, prompt, credential, session content, or confidential material.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior without attaching files.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
      description: List the smallest synthetic steps, expected behavior, and actual behavior.
      placeholder: "1. Open a new session\n2. Use this synthetic text: Example sentence.\n3. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and version
      placeholder: "Firefox 145 on macOS"
    validations:
      required: true
